name: Campfire
options:
  bundleIdPrefix: campfire
  defaultConfig: Release
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CampfireKit:
    path: CampfireKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Campfire:
    type: application
    platform: iOS
    sources:
      - path: Campfire
    dependencies:
      - package: CampfireKit
        product: CampfireKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: campfire.bench
        PRODUCT_NAME: Campfire
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Campfire
      configs:
        Release:
          # Strip symbols from the built app, as an archive would.
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          DEAD_CODE_STRIPPING: YES
    info:
      path: Campfire/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  CampfireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CampfireUITests
    dependencies:
      - target: Campfire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: campfire.bench.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Campfire
schemes:
  Campfire:
    build:
      targets:
        Campfire: all
        CampfireUITests: [test]
    test:
      targets:
        - CampfireUITests
    run:
      config: Release
      commandLineArguments:
        "-uvsBenchmark YES": false
    archive:
      config: Release
