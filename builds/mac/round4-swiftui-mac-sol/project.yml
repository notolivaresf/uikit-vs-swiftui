name: Campfire
options:
  bundleIdPrefix: campfire
  deploymentTarget:
    macOS: '15.0'
packages:
  CampfireKit:
    path: CampfireKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    DEVELOPMENT_TEAM: ''
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_OPTIMIZATION_LEVEL: '-O'
targets:
  Campfire:
    type: application
    platform: macOS
    sources: [Campfire]
    dependencies:
      - package: CampfireKit
        product: CampfireKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: campfire.bench
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Campfire
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: 'Campfire UI benchmark. Reference design © 37signals, LLC.'
  CampfireUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [CampfireUITests]
    dependencies:
      - target: Campfire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: campfire.bench.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Campfire:
    build:
      targets:
        Campfire: all
    run:
      config: Debug
    test:
      targets: [CampfireUITests]
