name: Campfire
options:
  bundleIdPrefix: campfire
  deploymentTarget:
    iOS: '18.0'
packages:
  CampfireKit:
    path: CampfireKit
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Campfire:
    type: application
    platform: iOS
    sources: [Campfire]
    dependencies:
      - package: CampfireKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: campfire.bench
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Campfire
      configs:
        Release:
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          STRIP_SWIFT_SYMBOLS: YES
  CampfireTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CampfireTests]
    dependencies:
      - target: Campfire
  CampfireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CampfireUITests]
    dependencies:
      - target: Campfire
schemes:
  Campfire:
    build:
      targets:
        Campfire: all
    test:
      targets: [CampfireTests, CampfireUITests]
