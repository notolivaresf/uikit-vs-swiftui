name: Campfire
options:
  bundleIdPrefix: campfire
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
packages:
  CampfireKit:
    path: CampfireKit
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    CODE_SIGN_STYLE: Automatic
    SWIFT_OPTIMIZATION_LEVEL: '-O'
targets:
  Campfire:
    type: application
    platform: iOS
    sources: [Campfire]
    dependencies:
      - package: CampfireKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: campfire.bench
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Campfire
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  CampfireTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CampfireTests]
    dependencies:
      - target: Campfire
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CampfireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CampfireUITests]
    dependencies:
      - target: Campfire
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Campfire:
    build:
      targets:
        Campfire: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [CampfireTests, CampfireUITests]
