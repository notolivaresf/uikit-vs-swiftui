name: Campfire
options:
  bundleIdPrefix: campfire
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  CampfireKit:
    path: CampfireKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Campfire:
    type: application
    platform: iOS
    sources: [Campfire]
    dependencies:
      - package: CampfireKit
        product: CampfireKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: campfire.bench
        PRODUCT_NAME: Campfire
        INFOPLIST_KEY_CFBundleDisplayName: Campfire
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
  CampfireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CampfireUITests]
    dependencies:
      - target: Campfire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: campfire.bench.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Campfire
schemes:
  Campfire:
    build:
      targets:
        Campfire: all
        CampfireUITests: [test]
    run:
      config: Release
    test:
      config: Release
      targets: [CampfireUITests]
